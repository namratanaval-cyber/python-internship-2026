<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Internship Board</h1>
        <p>Find your next internship opportunity</p>
    </header>

    <main>
        <section class="filters">
            <label for="search">Search internships</label>
            <input
                type="text"
                id="search"
                placeholder="Search by internship title..."
            >

            <label for="domain">Choose Domain</label>
            <select id="domain">
                <option value="all">All Domains</option>
                <option value="Web Development">Web Development</option>
                <option value="Data Science">Data Science</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
            </select>
        </section>

        <section id="internship-list" class="internship-list">
            <!-- Internship cards will appear here -->
        </section>

        <p id="empty-message" class="empty-message" hidden>
            No internships found.
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
